services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuelnow}
      POSTGRES_USER: ${POSTGRES_USER:-fuelnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - backend

  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 300m
    restart: unless-stopped
    networks:
      - backend

  etl:
    build:
      context: ./api
      dockerfile: Dockerfile.etl
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped
    networks:
      - backend

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    internal: false
